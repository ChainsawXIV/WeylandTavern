<div id="weyland-notes-debug" class="weyland-notes-debug">
    <div class="wn-debug-header">
        <div>
            <b>Notes debug</b>
            <span id="wn-debug-status" class="wn-debug-status"></span>
        </div>
        <span id="wn-debug-count" class="wn-debug-count"></span>
    </div>
    <section class="wn-debug-section">
        <h4>Current notes</h4>
        <div id="wn-debug-notes" class="wn-debug-notes"></div>
    </section>
    <section class="wn-debug-section">
        <h4>Injected context</h4>
        <pre id="wn-debug-inject" class="wn-debug-inject"></pre>
    </section>
    <section class="wn-debug-section wn-debug-log-section">
        <h4>Update log</h4>
        <div id="wn-debug-log" class="wn-debug-log"></div>
    </section>
</div>
