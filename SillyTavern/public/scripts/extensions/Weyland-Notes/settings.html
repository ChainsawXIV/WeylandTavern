<div class="weyland-notes-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Weyland Notes</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="weyland-notes-enabled" title="Let the model record lasting canon updates that override lorebooks">
                <input id="weyland-notes-enabled" type="checkbox">
                <span>Enabled</span>
            </label>
            <label class="checkbox_label" for="weyland-notes-debug-toggle" title="Show a live notes debug panel to the left of chat on desktop">
                <input id="weyland-notes-debug-toggle" type="checkbox">
                <span>Debug panel (desktop)</span>
            </label>
            <div id="weyland-notes-tools-warn" class="weyland-notes-warn" hidden>
                Enable <b>Function calling</b> on the Chat Completion preset or the model cannot record notes.
            </div>
            <div class="weyland-notes-list-header">Current notes</div>
            <div id="weyland-notes-list" class="weyland-notes-list"></div>
        </div>
    </div>
</div>
